name: Build and Deploy to VPS
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: NEXT_PUBLIC_BASE_URL,NEXT_PUBLIC_BETTER_AUTH_REDIRECT_URL,NEXT_PUBLIC_WEB_SOCKET_URL
          script: |
            cd /home/jassi/deployments/TheCoffeeRoom

            git fetch origin
            git reset --hard origin/main

            # Build images locally on VPS
            docker compose -f docker-compose.prod.yaml build \
              --build-arg NEXT_PUBLIC_BASE_URL=${{ secrets.NEXT_PUBLIC_BASE_URL }} \
              --build-arg NEXT_PUBLIC_BETTER_AUTH_REDIRECT_URL=${{ secrets.NEXT_PUBLIC_BETTER_AUTH_REDIRECT_URL }} \
              --build-arg NEXT_PUBLIC_WEB_SOCKET_URL=${{ secrets.NEXT_PUBLIC_WEB_SOCKET_URL }}

            # Stop and restart containers
            docker compose -f docker-compose.prod.yaml down
            docker compose -f docker-compose.prod.yaml up -d

            # Clean up dangling images from previous builds
            docker image prune -f

            echo "Deployment completed successfully!"